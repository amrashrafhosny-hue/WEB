<!DOCTYPE html>
<html>
    <head>
        <title>Form for registration</title>
        <meta charset="UTF-8">
        <meta name="discription" content="Form for registration for students"/>
        <link rel="stylesheet" href="style.css">
    </head>
    
    <body>  
        <h1>Form for Student </h1>
        <p style="font-weight: bold; size: 25px;">please fill out the form to register</p>
        <form>
            <label>Student name:</label>
            <input type="text" placeholder="First name">
            <input type="text" placeholder="Last name">
            <br><br>

            <label>Student code :</label>
            <input type="number" placeholder=" code">
            <br><br>

            <label>Email :</label>
            <input type="email" placeholder=" email">
            <br><br>

            <label>Phone Number :</label>
            <input type="tel" placeholder="phone">
            <br><br>

            <label>Birthday Date :</label>
            <input type="date" placeholder="Birthday date">
            <br><br>

            <label> Adresss:</label>
            <input type="text" placeholder="adresss">
            <br><br>

            <label> Password :</label>
            <input type="password" placeholder="Password">
            <br><br>

            <label> Confirm password :</label>
            <input type="password" placeholder="Confirm password">
            <br><br>
            <button type="submit">Register</button>
            <br><br>

        </form>
    </body>
</html>
